<style>

.ftr-char.fallback{background:#334155;color:#e2e8f0;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;text-align:center;padding:2px;overflow:hidden}

.ftr-seat-body{display:flex;gap:8px;align-items:center}

.rcard{width:36px;height:50px;border-radius:6px;background:#f8fafc;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:1px 2px 3px #0008;border:2px solid #cbd5e1;cursor:pointer}

/* Regicide sprite sheet: 14 cols (Jester/back, A..K) x 4 rows (spade,heart,club,diamond), cell 240x336 */
.rcimg{width:48px;height:67px;border-radius:6px;background-image:url(regicide-cards.webp);background-size:672px 268px;box-shadow:1px 2px 3px #0008;cursor:pointer;flex:none}

/* Card animations: .card-in is added by JS only to newly-appearing cards (diffed against previous board), so the 3s poll re-render does not replay them */
@keyframes cardIn{from{opacity:0;transform:translateY(-14px) scale(.7) rotateY(70deg)}to{opacity:1;transform:none}}
@keyframes hitShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes selPop{0%{transform:translateY(-4px) scale(1)}40%{transform:translateY(-10px) scale(1.08)}100%{transform:translateY(-4px) scale(1)}}
.card-in{animation:cardIn .35s ease-out}
.hit-shake{animation:hitShake .4s ease}
#rgHand .rcimg{transition:transform .15s ease}
#rgHand .rcimg:active{transform:scale(.92)}
.rcimg.sel{animation:selPop .3s ease}
@media (prefers-reduced-motion:reduce){.card-in,.hit-shake,.rcimg.sel{animation:none}#rgHand .rcimg{transition:none}}
.deckpile{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0}
.lobby-note{text-align:center;padding:10px}
button{font-size:17px;padding:12px 18px;border:0;border-radius:10px;margin:4px;cursor:pointer}

.hit{background:#f59e0b;color:#111;font-weight:800}.stay{background:#334155;color:#fff}
.log{white-space:pre-wrap;font-size:14px;max-height:220px;overflow:auto}
.small{font-size:13px;color:#94a3b8} .hidden{display:none}
.targetbtn{display:block;width:100%;background:#475569;color:#fff}

.ocard{width:58px;height:109px;border-radius:6px;background-image:url(odin-cards.webp);background-size:580px 654px;box-shadow:1px 2px 3px #0008;flex:none;cursor:pointer;transition:transform .15s ease}
.ocard.big{width:72px;height:135px;background-size:720px 810px}
.ocard:active{transform:scale(.92)}
.ocard.sel{outline:3px solid #f59e0b;transform:translateY(-4px);animation:selPop .3s ease}
.handbacks .ocard{width:24px;height:34px;background-image:none;cursor:default}
.odtable{display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:8px 0}
.odvalue{background:#f59e0b;color:#111;border-radius:999px;padding:4px 12px;font-weight:900;font-size:18px}

.lsdcard{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:1px 2px 3px #0008;flex:none;cursor:pointer;transition:transform .15s ease;background:#000;position:relative}

/* Spots: dog cards from BGA sprite (8 cols x 4 rows), dice as text */

.sdice{display:inline-block;width:36px;height:38px;margin:2px;vertical-align:middle;cursor:pointer}

.ydice{display:flex;justify-content:center;gap:6px;margin:8px 0;flex-wrap:wrap}

.ftplayers{display:flex;flex-direction:column;gap:8px}
.ftpc{background:rgba(15,23,42,.85);border:2px solid #334155;border-radius:12px;padding:8px}
.ftpc.current{border-color:#f59e0b;box-shadow:0 0 10px #f59e0b55}
.ftgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.ftcellwrap{display:flex;flex-direction:column}

.ftcs-XL{top:100.7cqw;height:33.1cqw}.ftcs-L{top:106.1cqw;height:27.7cqw}.ftcs-M{top:110.8cqw;height:23cqw}.ftcs-S{top:114.2cqw;height:20.3cqw}

   Card faces are HTML overlays (name strip + icon ability/scoring lines), like BGA. */
@font-face{font-family:'Vinque';src:url(cc-icons/vinque.woff) format('woff')}
.cctile{width:66px;height:93px;border-radius:6px;background-repeat:no-repeat;background-color:#1e293b;box-shadow:1px 2px 3px #0008;flex:none;cursor:pointer;position:relative;container-type:size}

.ccface{position:absolute;inset:0;pointer-events:none;font-family:Vinque,serif;color:#3b2b1d}
.ccicon{display:inline-block;background-repeat:no-repeat;vertical-align:middle;flex:none}
.ccseg{line-height:1}
.ccgoldc{position:absolute;top:9%;left:22%;right:12%;height:44%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px}
.ccgn{font-size:8cqw;color:#7a5b00}
.ccname{position:absolute;top:54%;left:8.4%;width:50.3%;height:7%;transform:rotate(-90deg);transform-origin:top left;white-space:nowrap;overflow:hidden}
.ccmn{width:35%}
.ccname span{font-size:11cqw;font-style:normal;display:block}
.ccabs{position:absolute;top:60%;left:4%;right:4%;height:19%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ccsc{position:absolute;top:79.5%;left:8%;right:8%;height:16.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ccab{display:flex;align-items:center;justify-content:center;gap:1px;font-size:6.6cqw;line-height:1;max-width:100%;overflow:hidden;white-space:nowrap}
.cccbtns{display:flex;gap:2px;margin:2px 0 0}

  <script>

const FX={capture(sel,attr){let m={};document.querySelectorAll(sel).forEach(el=>{let k=el.getAttribute(attr);if(k!==null)m[k]=el.getBoundingClientRect();});return m;},
 fly(src,from,to,scale){if(!from||!to)return;let img=document.createElement('img');img.className='fxfly';img.src=src;
 let cx=from.left+from.width/2,cy=from.top+from.height/2,tx=to.left+to.width/2,ty=to.top+to.height/2;
 img.style.left=from.left+'px';img.style.top=from.top+'px';img.style.width=from.width+'px';img.style.height=from.height+'px';
 document.body.appendChild(img);requestAnimationFrame(()=>{img.style.transform='translate('+(tx-cx)+'px,'+(ty-cy)+'px) scale('+(scale||.25)+') rotate(10deg)';img.style.opacity='.12';});
 setTimeout(()=>img.remove(),700);},
 tile(html,from,to,scale){if(!from||!to)return;let box=document.createElement('div');box.innerHTML=html;let el=box.firstElementChild;
 if(!el)return;let cx=from.left+from.width/2,cy=from.top+from.height/2,tx=to.left+to.width/2,ty=to.top+to.height/2;
 el.classList.add('fxfly');el.style.position='fixed';el.style.margin='0';el.style.left=from.left+'px';el.style.top=from.top+'px';
 el.style.width=from.width+'px';el.style.height=from.height+'px';document.body.appendChild(el);
 requestAnimationFrame(()=>{el.style.transform='translate('+(tx-cx)+'px,'+(ty-cy)+'px) scale('+(scale||.35)+') rotate(8deg)';el.style.opacity='.12';});
 setTimeout(()=>el.remove(),700);},
 bump(root,attr,oldCounts,newCounts){oldCounts=oldCounts||{};newCounts=newCounts||{};
 (root||document).querySelectorAll('[data-fx-count]').forEach(el=>{let k=el.getAttribute(attr||'data-fx-count');
 if(oldCounts[k]!==undefined&&oldCounts[k]!==newCounts[k]){el.classList.remove('fxbump');void el.offsetWidth;el.classList.add('fxbump');}});},
  popup(html,ms){let p=document.getElementById('fxPopup');if(!p)return;p.innerHTML=html;p.classList.remove('hidden','fxpopupin');void p.offsetWidth;p.classList.add('fxpopupin');
  clearTimeout(FX._timer);FX._timer=setTimeout(()=>p.classList.add('hidden'),ms||2800);}};

</script>
<script>
window.PXSCROLL={
 save(selectors){
  let root=document.scrollingElement||document.documentElement;
  let items=[{sel:null,top:root.scrollTop,left:root.scrollLeft}];
  (selectors||[]).forEach(sel=>{let el=document.querySelector(sel);
   if(el)items.push({sel:sel,top:el.scrollTop,left:el.scrollLeft});});
  return items;
 },
 restore(items){
  if(!items)return;
  let apply=()=>items.forEach(it=>{let el=it.sel?document.querySelector(it.sel):
   (document.scrollingElement||document.documentElement);
   if(el){el.scrollTop=it.top;el.scrollLeft=it.left;}});
  apply();requestAnimationFrame(apply);
 }
};
</script>
